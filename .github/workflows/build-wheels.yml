name: Build wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_linux_x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (Linux x86_64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  build_linux_aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (Linux aarch64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: wheelhouse/*.whl

  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (macOS arm64, Metal)
        run: cibuildwheel --output-dir wheelhouse --archs arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  build_macos_x86_64:
    # macos-13 (Intel) runners are scarce and queue for a long time on
    # GHA. macos-14 (Apple Silicon) runners are plentiful; cibuildwheel
    # uses Rosetta 2 to run x86_64 Python and build x86_64 wheels
    # natively (not cross-compile — the binaries are real x86_64).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (macOS x86_64, CPU only — no Metal on Intel)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: wheelhouse/*.whl

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (Windows AMD64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs AMD64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-amd64
          path: wheelhouse/*.whl

  build_windows_arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels (Windows ARM64, CPU)
        # ggml-cpu rejects MSVC on ARM — use clang-cl via the override
        # block in pyproject.toml. Vulkan is skipped on ARM64.
        run: cibuildwheel --output-dir wheelhouse --archs ARM64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: wheelhouse/*.whl

  publish:
    needs:
      - build_linux_x86_64
      - build_linux_aarch64
      - build_macos
      - build_macos_x86_64
      - build_windows
      - build_windows_arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
