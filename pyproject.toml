[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "mineru-llama-cpp"
version = "0.1.0"
description = "In-process llama.cpp VLM inference engine for MinerU"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "pillow"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/mineru_llama_cpp"]
build-dir = "build"

# llama.cpp's own CMakeLists.txt installs C/C++ dev artifacts (headers, CMake
# package config, pkg-config) alongside the runtime shared libs we actually
# need. We ship llama-server and the shared libs (runtime deps of
# _mineru_llama_cpp), but not files meant for compiling against llama.cpp/ggml
# from source.
#
# Each versioned lib is a 3-name symlink chain in the build tree
# (libggml.dylib -> libggml.0.dylib -> libggml.0.17.0.dylib; on Linux
# libggml.so -> .so.0 -> .so.0.17.0). scikit-build-core dereferences symlinks
# and would write all three as full copies -- ~3x bloat. Runtime only needs the
# SONAME (macOS libX.0.dylib / Linux libX.so.0), which is what our binaries'
# @rpath/DT_NEEDED entries actually reference. So we exclude:
#   - the full-version file (>=3 version segments)
#   - the unversioned dev symlink (link-time only)
# and keep the SONAME. Patterns are version-number-agnostic so they survive a
# llama.cpp bump. libllama-server-impl is an unversioned single MODULE bundle
# (looks like a dev symlink but has no chain) -- force-kept via "!" negation.
#
# lib/ paths below are prefixed mineru_llama_cpp/lib/ (not top-level lib/):
# CMAKE_INSTALL_LIBDIR is set to "mineru_llama_cpp/lib" (top-level
# CMakeLists.txt) so runtime artifacts stay scoped inside the Python package
# rather than at the wheel root -- see that file's comment for why. include/
# is unaffected (CMAKE_INSTALL_INCLUDEDIR is untouched, still wheel-root
# "include/").
wheel.exclude = [
    "include/**",
    "mineru_llama_cpp/lib/cmake/**",
    "mineru_llama_cpp/lib/pkgconfig/**",
    "mineru_llama_cpp/lib/*.*.*.*.dylib",                 # macOS full-version libX.0.17.0.dylib
    "mineru_llama_cpp/lib/*.so.*.*.*",                    # Linux full-version libX.so.0.17.0
    "mineru_llama_cpp/lib/*[!0-9].dylib",                 # macOS unversioned dev symlink libX.dylib
    "mineru_llama_cpp/lib/*[!0-9].so",                    # Linux unversioned dev symlink libX.so
    "!mineru_llama_cpp/lib/libllama-server-impl.dylib",   # keep single-bundle module (macOS)
    "!mineru_llama_cpp/lib/libllama-server-impl.so",      # keep single-bundle module (Linux)
]

# Editable install mode "inplace" compiles the extension module directly into
# src/mineru_llama_cpp/ alongside the .pyi stub and py.typed marker, so that
# type checkers (basedpyright/pyright) find both the stub and the module source
# in the same directory. The default "redirect" mode installs the .so into
# site-packages while leaving stubs in src/, which triggers the yellow
# reportMissingModuleSource warning.
[tool.scikit-build.editable]
mode = "inplace"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
norecursedirs = ["legacy_spike"]

# --- cibuildwheel: cross-platform wheel building ---
#
# Builds 4 wheels per Python version (3.10–3.13) = 16 total:
#   macOS arm64 (Metal)    — no extra flags, Metal auto-detected
#   Linux x86_64 (Vulkan)  — vulkan-headers + vulkan-loader-devel installed
#   Linux aarch64 (Vulkan) — same, native arm64 runner
#   Windows x86_64 (CPU)   — CMAKE_GENERATOR=Ninja (avoids VS multi-config
#                            Release/ subdirectory issue), /utf-8 is already
#                            in CMakeLists.txt. Vulkan SDK not installed in
#                            CI yet — CPU backend works, Vulkan can be added
#                            later.
#
# Tests are skipped (need GGUF model files, not available in CI).
# The patch auto-application (patches/llama.cpp/*.patch) requires git in
# the build container — installed via before-all.

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
build-frontend = "build"
test-skip = "*"

[tool.cibuildwheel.linux]
# Install Vulkan SDK from LunarG repo — provides glslc (SPIR-V shader
# compiler, required by CMake's FindVulkan to build the Vulkan backend
# MODULE's shaders). vulkan-headers/vulkan-loader-devel alone don't
# include glslc (it's part of Shaderc, not the Vulkan loader package).
environment = { SKBUILD_CMAKE_ARGS = "-DGGML_VULKAN=ON" }
before-all = """yum install -y epel-release && \
yum install -y git && \
curl -s https://packages.lunarg.com/lunarg-signing-key-pub.asc > /etc/pki/rpm-gpg/RPM-GPG-KEY-lunarg && \
curl -s -o /etc/yum.repos.d/lunarg-vulkan.repo https://packages.lunarg.com/vulkan/lunarg-vulkan-el8.repo && \
yum install -y vulkan-sdk"""

[tool.cibuildwheel.macos]
# Metal is auto-detected on Apple Silicon. No extra flags.
# x86_64 (Intel Mac) is skipped — Metal doesn't work on Intel, per the
# platform matrix decision.
archs = ["arm64"]

[tool.cibuildwheel.windows]
# Force Ninja generator — Visual Studio generator (default) is multi-config
# and puts the .pyd in a Release/ subdirectory, which Python can't find.
# /utf-8 is already in CMakeLists.txt (handles non-English Windows).
# Vulkan SDK installed via before-all (provides glslc + headers, same as
# what we did on the Windows laptop).
# Disable delvewheel — our DLLs are already in bin/ and lib/ inside the
# wheel, and __init__.py adds those to the DLL search path via
# os.add_dll_directory(). delvewheel can't find them during its scan
# (it only looks next to the .pyd), so it errors out.
repair-wheel-command = ""
environment = { CMAKE_GENERATOR = "Ninja", VULKAN_SDK = "C:\\VulkanSDK" }
before-all = "pip install ninja && curl -sL -o C:\\vulkansdk.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe && C:\\vulkansdk.exe --accept-licenses --default-root=C:\\VulkanSDK --silent"
archs = ["AMD64"]
