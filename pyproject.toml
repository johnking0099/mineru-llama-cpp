[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "mineru-llama-cpp"
version = "0.1.0"
description = "In-process llama.cpp VLM inference engine for MinerU"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "pillow"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/mineru_llama_cpp"]
build-dir = "build"

# llama.cpp's own CMakeLists.txt installs C/C++ dev artifacts (headers, CMake
# package config, pkg-config) alongside the runtime shared libs we actually
# need. We ship llama-server and the shared libs (runtime deps of
# _mineru_llama_cpp), but not files meant for compiling against llama.cpp/ggml
# from source.
#
# Each versioned lib is a 3-name symlink chain in the build tree
# (libggml.dylib -> libggml.0.dylib -> libggml.0.17.0.dylib; on Linux
# libggml.so -> .so.0 -> .so.0.17.0). scikit-build-core dereferences symlinks
# and would write all three as full copies -- ~3x bloat. Runtime only needs the
# SONAME (macOS libX.0.dylib / Linux libX.so.0), which is what our binaries'
# @rpath/DT_NEEDED entries actually reference. So we exclude:
#   - the full-version file (>=3 version segments)
#   - the unversioned dev symlink (link-time only)
# and keep the SONAME. Patterns are version-number-agnostic so they survive a
# llama.cpp bump. libllama-server-impl is an unversioned single MODULE bundle
# (looks like a dev symlink but has no chain) -- force-kept via "!" negation.
#
# lib/ paths below are prefixed mineru_llama_cpp/lib/ (not top-level lib/):
# CMAKE_INSTALL_LIBDIR is set to "mineru_llama_cpp/lib" (top-level
# CMakeLists.txt) so runtime artifacts stay scoped inside the Python package
# rather than at the wheel root -- see that file's comment for why. include/
# is unaffected (CMAKE_INSTALL_INCLUDEDIR is untouched, still wheel-root
# "include/").
wheel.exclude = [
    "include/**",
    "mineru_llama_cpp/lib/cmake/**",
    "mineru_llama_cpp/lib/pkgconfig/**",
    "mineru_llama_cpp/lib/*.*.*.*.dylib",                 # macOS full-version libX.0.17.0.dylib
    "mineru_llama_cpp/lib/*.so.*.*.*",                    # Linux full-version libX.so.0.17.0
    "mineru_llama_cpp/lib/*[!0-9].dylib",                 # macOS unversioned dev symlink libX.dylib
    "mineru_llama_cpp/lib/*[!0-9].so",                    # Linux unversioned dev symlink libX.so
    "!mineru_llama_cpp/lib/libllama-server-impl.dylib",   # keep single-bundle module (macOS)
    "!mineru_llama_cpp/lib/libllama-server-impl.so",      # keep single-bundle module (Linux)
]

# Editable install mode "inplace" compiles the extension module directly into
# src/mineru_llama_cpp/ alongside the .pyi stub and py.typed marker, so that
# type checkers (basedpyright/pyright) find both the stub and the module source
# in the same directory. The default "redirect" mode installs the .so into
# site-packages while leaving stubs in src/, which triggers the yellow
# reportMissingModuleSource warning.
[tool.scikit-build.editable]
mode = "inplace"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
norecursedirs = ["legacy_spike"]

# --- cibuildwheel: cross-platform wheel building ---
#
# Builds 4 wheels per Python version (3.10–3.13) = 16 total:
#   macOS arm64 (Metal)    — no extra flags, Metal auto-detected
#   Linux x86_64 (Vulkan)  — vulkan-headers + vulkan-loader-devel + glslc
#                            from AlmaLinux 9 appstream repo (no LunarG repo
#                            needed; LunarG only publishes apt .list files).
#   Linux aarch64 (Vulkan) — same, native arm64 runner
#   Windows x86_64 (Vulkan) — SDK downloaded from sdk.lunarg.com and 7z-
#                             extracted to C:\VulkanSDK (NSIS installer doesn't
#                             support silent install flags). CMAKE_GENERATOR=
#                             Ninja avoids VS multi-config Release/ subdir
#                             issue; /utf-8 is already in CMakeLists.txt.
#
# Tests are skipped (need GGUF model files, not available in CI).
# The patch auto-application (patches/llama.cpp/*.patch) requires git in
# the build container — installed via before-all.

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# Skip musllinux (Alpine) — MinerU's user base is on glibc systems
# (Ubuntu/CentOS/Fedora). Skipping musllinux also simplifies the
# ISA-level tag handling below (musllinux has its own tag namespace).
skip = "*-musllinux*"
build-frontend = "build"
test-skip = "*"
# manylinux_2_34 (glibc 2.34) — llama.cpp's vendored subprocess.h uses
# posix_spawn_file_actions_addchdir_np, which requires glibc >= 2.29.
# manylinux_2_28 (glibc 2.28) doesn't have it.
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.linux]
# Vulkan deps come from AlmaLinux 9's own appstream repo (no LunarG repo
# needed — LunarG only publishes apt .list files, not yum/dnf .repo files).
# - vulkan-headers + vulkan-loader-devel: headers and libvulkan.so symlink
# - glslc: SPIR-V shader compiler (part of shaderc; FindVulkan component)
# - glslang: provides glslangValidator (optional FindVulkan component;
#   silences the "missing components: glslangValidator" warning)
# - spirv-headers-devel: provides SPIRV-HeadersConfig.cmake, which
#   ggml-vulkan/CMakeLists.txt:14's find_package(SPIRV-Headers CONFIG
#   REQUIRED) needs — without it the configure step fails.
# git is needed for the patches/llama.cpp/*.patch auto-apply step in the
# top-level CMakeLists.txt (uses `git apply`).
environment = { SKBUILD_CMAKE_ARGS = "-DGGML_VULKAN=ON" }
before-all = "yum install -y git vulkan-headers vulkan-loader-devel glslc glslang spirv-headers-devel"
# Clean the build directory before each Python version's build. scikit-build-core's
# build-dir = "build" reuses the same path across Python versions; llama.cpp's
# vulkan-shaders-gen ExternalProject (BUILD_ALWAYS TRUE) doesn't tolerate this —
# its stamps end up inconsistent on the 2nd+ build, and ninja fails with
# "no such file or directory" trying to cd into a non-existent build subdir.
before-build = "rm -rf build"
# ggml-cpu enables AVX2/FMA/BMI2/F16C by default (all x86_64-v3 instructions).
# auditwheel detects this and refuses to repair to manylinux_2_34_x86_64
# (v1 baseline) without --disable-isa-ext-check. We disable the check —
# the resulting wheel still carries the manylinux_2_34_x86_64 tag (so pip
# will install it on any x86_64 Linux), but it actually requires a v3 CPU
# to run. This matches how most numerical Python packages (numpy, scipy)
# ship v3-requiring wheels under plain manylinux tags.
repair-wheel-command = "auditwheel repair --disable-isa-ext-check -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Metal is auto-detected on Apple Silicon. No extra flags.
# x86_64 (Intel Mac) is skipped — Metal doesn't work on Intel, per the
# platform matrix decision.
archs = ["arm64"]

[tool.cibuildwheel.windows]
# Force Ninja generator — Visual Studio generator (default) is multi-config
# and puts the .pyd in a Release/ subdirectory, which Python can't find.
# /utf-8 is already in CMakeLists.txt (handles non-English Windows).
# MSVC compiler setup is handled by the ilammy/msvc-dev-cmd@v1 GHA action
# in .github/workflows/build-wheels.yml, which calls vcvars64.bat and adds
# the MSVC bin directory to PATH before cibuildwheel spawns the build.
# This avoids the MinGW compiler that GHA Windows runners ship in PATH —
# MinGW-compiled DLLs depend on libgcc_s_seh-1.dll, libstdc++-6.dll,
# libwinpthread-1.dll, none of which are on end-user machines. MSVC-built
# DLLs link against vcruntime140.dll/msvcp140.dll, which the Python
# interpreter already ships, so no extra runtime dependency is added.
# Vulkan SDK: download the official .exe from sdk.lunarg.com and extract
# with 7z (the NSIS installer doesn't support silent install flags; 7z
# treats the .exe as a self-extracting archive and just unpacks the files).
# VULKAN_SDK env var lets CMake's FindVulkan locate headers + libs + glslc
# (under $VULKAN_SDK/Bin). 7-Zip is preinstalled on GHA Windows runners.
# Note: before-all runs via cmd /c on Windows (cibuildwheel), not PowerShell
# — single quotes are passed literally to native commands, which broke
# curl's URL parsing (exit 3 = URL malformed). Use double quotes for args
# that need quoting; URL and -o<dir> don't need quotes (no spaces).
# Disable delvewheel — our DLLs are already in bin/ and lib/ inside the
# wheel, and __init__.py adds those to the DLL search path via
# os.add_dll_directory(). delvewheel can't find them during its scan
# (it only looks next to the .pyd), so it errors out.
repair-wheel-command = ""
environment = { CMAKE_GENERATOR = "Ninja", VULKAN_SDK = "C:\\VulkanSDK", SKBUILD_CMAKE_ARGS = "-DGGML_VULKAN=ON" }
before-all = "pip install ninja && curl.exe -sL -o vulkan_sdk.exe \"https://sdk.lunarg.com/sdk/download/1.4.350.0/windows/vulkan_sdk.exe\" && .\\vulkan_sdk.exe -t C:\\VulkanSDK --accept-licenses --default-answer --confirm-command install"
archs = ["AMD64", "ARM64"]

# ARM64 cross-compiled from amd64 host. llama.cpp's ggml-cpu rejects MSVC on
# ARM (CMakeLists.txt:106: "MSVC is not supported for ARM, use clang"), so
# use clang-cl — which GHA Windows runners ship in VS's LLVM component.
# Vulkan is skipped on ARM64 for now (LunarG SDK's ARM64 vulkan-1.lib is
# not on the standard x64 SDK; can revisit later if ARM64 GPU accel is
# needed — ARM64 Windows devices mostly have weak iGPUs anyway).
# OpenMP is OFF on ARM64 because ggml-cpu's ARM OpenMP path is untested
# here and libomp ARM64 isn't in the wheel.
[[tool.cibuildwheel.overrides]]
select = "cp*-win_arm64"
inherit = { "environment" = "none", "before-all" = "none" }
environment = { CMAKE_GENERATOR = "Ninja", SKBUILD_CMAKE_ARGS = "-DCMAKE_C_COMPILER=clang-cl;-DCMAKE_CXX_COMPILER=clang-cl;-DGGML_OPENMP=OFF" }
before-all = "pip install ninja"
